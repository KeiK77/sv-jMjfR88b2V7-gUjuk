<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妊娠期・産後 健康調査アンケート</title>
<style>
  :root{
    --ink:#1f2a2e;
    --sub:#5b6b6f;
    --paper:#f6f5f1;
    --card:#ffffff;
    --line:#dfe3e0;
    --teal:#2f6f68;
    --teal-dark:#1f4f4a;
    --teal-tint:#e7f0ee;
    --amber:#c98a3a;
    --amber-tint:#fbf1e2;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:120px;
  }
  header.top{ background:var(--teal-dark); color:#fff; padding:28px 20px 22px; }
  header.top h1{ margin:0 0 6px; font-size:1.35rem; font-weight:700; letter-spacing:.02em; }
  header.top p{ margin:0; color:#cfe4e0; font-size:.88rem; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:18px; }
  .panel h2{ font-size:1.02rem; margin:0 0 4px; color:var(--teal-dark); }
  .panel .cat-count{ font-size:.78rem; color:var(--sub); margin-bottom:14px; }
  .stage-select{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
  .stage-btn{ border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:14px 8px; font-size:.86rem; font-weight:600; color:var(--ink); cursor:pointer; text-align:center; line-height:1.4; transition:all .15s ease; }
  .stage-btn small{ display:block; font-weight:400; color:var(--sub); font-size:.72rem; margin-top:3px; }
  .stage-btn.active{ border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark); }
  .meta-row{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .meta-field{flex:1; min-width:140px;}
  label.field-label{ display:block; font-size:.8rem; color:var(--sub); margin-bottom:5px; }
  input[type=text], input[type=number], input[type=date], input[type=time], textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 11px; font-size:.95rem;
    font-family:inherit; background:#fdfdfc; color:var(--ink);
  }
  textarea{min-height:64px; resize:vertical;}
  input:focus, textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}

  #progress-bar{ position:sticky; top:0; z-index:20; background:var(--paper); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
  .progress-track{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); width:0%; transition:width .2s ease; }
  .progress-label{ font-size:.72rem; color:var(--sub); margin-top:4px; display:flex; justify-content:space-between; }

  section.category{ margin-top:22px; }
  section.category .cat-header{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--teal); padding-bottom:8px; margin-bottom:4px; }
  section.category .cat-header h2{ font-size:1.05rem; color:var(--teal-dark); margin:0; }
  section.category .cat-header .cnt{ font-size:.75rem; color:var(--sub); }
  .item{ padding:16px 4px; border-bottom:1px solid var(--line); }
  .item:last-child{border-bottom:none;}
  .item.hidden-cond{ display:none !important; }
  .item .qtext{ font-size:.95rem; font-weight:600; margin-bottom:8px; display:flex; gap:6px; align-items:flex-start; }
  .item .qno{ color:var(--teal); font-weight:700; font-size:.82rem; flex-shrink:0; min-width:34px; }
  .item-note{ font-size:.76rem; color:var(--sub); margin:-4px 0 10px 40px; }
  .warn-flag{ display:inline-block; font-size:.68rem; background:var(--amber-tint); color:var(--amber); border:1px solid #ecd3ac; border-radius:5px; padding:1px 6px; margin-left:6px; font-weight:600; vertical-align:middle; cursor:help; }
  .chg-flag{ display:inline-block; font-size:.68rem; background:#e6f0fb; color:#2a5fa5; border:1px solid #b9d3f0; border-radius:5px; padding:1px 6px; margin-left:6px; font-weight:700; vertical-align:middle; }
  .item.is-changed .qtext > span:last-child{ font-weight:800; }
  .cat-intro{ font-size:.82rem; color:var(--ink); background:#f2f6f4; border-left:3px solid var(--teal); border-radius:6px; padding:9px 12px; margin:6px 0 12px; }
  .cat-intro.new-mark::before{ content:"🆕 "; }
  .lead-note{ font-size:.82rem; color:var(--teal-dark); background:var(--teal-tint); border-radius:8px; padding:9px 12px; margin:14px 0 6px; font-weight:600; }
  .lead-note.new-mark::before{ content:"🆕 "; }
  .opt-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt-btn{ border:1.4px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-size:.85rem; cursor:pointer; color:var(--ink); }
  .opt-btn.selected{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .scale-grid{ display:flex; gap:6px; flex-wrap:wrap; }
  .scale-grid .opt-btn{ flex:1; min-width:64px; text-align:center; }
  .slider-wrap{padding:6px 4px 0;}
  .slider-value{ font-weight:700; color:var(--teal-dark); font-size:.95rem; margin-bottom:6px; display:inline-block; background:var(--teal-tint); padding:2px 10px; border-radius:6px; }
  input[type=range]{ width:100%; accent-color:var(--teal); }
  .slider-scale-labels{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--sub); margin-top:2px; }
  .rpe-legend{ font-size:.7rem; color:var(--sub); margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 10px; }
  .unit-suffix{ font-size:.8rem; color:var(--sub); margin-left:6px; }
  .side-by-side{ display:flex; gap:10px; align-items:center; }
  .side-by-side .sub{ flex:1; }
  .side-by-side .sub .lbl{ font-size:.72rem; color:var(--sub); margin-bottom:3px; }
  .other-text{ margin-top:8px; }
  .child-block{ border:1px dashed var(--line); border-radius:10px; padding:12px; margin-top:10px; background:#fafaf8; }
  .child-age{ margin-top:8px; }
  .child-age .lbl{ font-size:.8rem; color:var(--sub); margin-bottom:4px; }

  #footer-bar{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; justify-content:center; z-index:30; box-shadow:0 -4px 14px rgba(0,0,0,.05); }
  .btn{ border:none; border-radius:9px; padding:13px 18px; font-size:.9rem; font-weight:700; cursor:pointer; }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-secondary{background:var(--teal-tint); color:var(--teal-dark);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .empty-hint{ text-align:center; color:var(--sub); padding:60px 20px; font-size:.9rem; }
  .top-note{ font-size:.78rem; color:var(--sub); background:var(--teal-tint); border-radius:8px; padding:10px 12px; margin-top:14px; }
  #done-screen{ text-align:center; padding:60px 20px; }
  #done-screen h2{color:var(--teal-dark);}
  #done-screen .btn{margin:6px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="gate-screen" style="max-width:400px;margin:80px auto;padding:0 20px;text-align:center;">
  <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 24px;">
    <h1 style="font-size:1.1rem;color:var(--teal-dark);margin:0 0 6px;">妊娠期・産後 健康調査アンケート</h1>
    <p style="font-size:.82rem;color:var(--sub);margin:0 0 20px;">担当者から伝えられた合言葉を入力してください</p>
    <input type="text" id="gate-input" placeholder="合言葉" autocomplete="off" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:1rem;text-align:center;">
    <div id="gate-error" style="color:#b3452f;font-size:.78rem;margin-top:8px;min-height:1.2em;"></div>
    <button id="gate-submit" class="btn btn-primary" style="width:100%;margin-top:14px;">進む</button>
  </div>
</div>

<div id="app-content" class="hidden">

<header class="top">
  <div class="wrap">
    <h1>妊娠期・産後 健康調査アンケート</h1>
    <p>身体活動・腰痛・骨盤帯痛・睡眠・気分に関する調査です。回答時期を選ぶと、その時期に必要な質問だけが表示されます。</p>
  </div>
</header>

<div id="progress-bar" class="hidden">
  <div class="wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">0 / 0 項目</span><span id="progress-pct">0%</span></div>
  </div>
</div>

<div class="wrap">

  <div class="panel" id="stage-panel">
    <h2>1. 回答のタイミングを選択してください</h2>
    <div class="cat-count">選択した時期に応じて、以下の質問が自動で表示されます。</div>
    <div class="stage-select">
      <button class="stage-btn" data-stage="初回">初回<small>妊娠期・最初の回答</small></button>
      <button class="stage-btn" data-stage="2回目以降">2回目以降<small>妊娠期・毎回</small></button>
      <button class="stage-btn" data-stage="産後">産後<small>産後1か月など</small></button>
    </div>

    <div class="meta-row">
      <div class="meta-field">
        <label class="field-label">回答日</label>
        <input type="date" id="answer-date">
      </div>
    </div>
    <div class="top-note" id="stage-explain"></div>
  </div>

  <div id="form-area"></div>

</div>

<div id="footer-bar" class="hidden">
  <button class="btn btn-secondary" id="btn-json">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv">CSVで保存</button>
  <button class="btn btn-primary" id="btn-finish">回答を確認して完了</button>
</div>

<div id="done-screen" class="hidden">
  <h2>ご回答ありがとうございました</h2>
  <p id="submit-status">送信しています…</p>
  <p style="font-size:.8rem;color:var(--sub);">念のため、下のボタンからも回答データを保存できます。</p>
  <button class="btn btn-primary" id="btn-json-2">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv-2">CSVで保存</button>
  <div style="margin-top:14px;"><button class="btn btn-secondary" id="btn-back">回答画面に戻る</button></div>
</div>

</div>

<script>
const ITEMS = JSON.parse(document.getElementById('items-data').textContent);
const CATEGORY_INTRO = JSON.parse(document.getElementById('category-intro-data').textContent);

// Googleスプレッドシート連携用のウェブアプリURL（Apps Scriptをデプロイして取得したURLに置き換えてください）
const SUBMIT_URL = 'https://script.google.com/macros/s/AKfycbzzW3U-eq_XJyYFHfVvTjBnrkCAMsrvId8e2LSd5P16AmO1J4dGzwBLb1zhkCVp3reHOQ/exec';

// 合言葉ゲート
const GATE_PASSCODE = 'J55772';
function tryGate(){
  const val = document.getElementById('gate-input').value.trim();
  const err = document.getElementById('gate-error');
  if(val === GATE_PASSCODE){
    document.getElementById('gate-screen').classList.add('hidden');
    document.getElementById('app-content').classList.remove('hidden');
  } else {
    err.textContent = '合言葉が正しくありません。担当者にご確認ください。';
  }
}
document.getElementById('gate-submit').addEventListener('click', tryGate);
document.getElementById('gate-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryGate();
});

const STAGE_RULES = {
  '初回':        t => t === '毎回' || t === '初回' || t === '産前のみ',
  '2回目以降':   t => t === '毎回' || t === '産前のみ',
  '産後':        t => t === '毎回' || t === '産後のみ',
};
const STAGE_EXPLAIN = {
  '初回': '基本情報（初回のみの項目を含む）、毎回聞く項目、妊娠中の身体活動質問紙（PPAQ）を表示します。',
  '2回目以降': '基本情報（初回のみの項目は除く）、毎回聞く項目、PPAQを表示します。',
  '産後': '基本情報、毎回聞く項目、エジンバラ産後うつ病質問票（EPDS）を表示します。PPAQは表示しません。',
};

let currentStage = null;
const answers = {}; // no -> value (string, array for multi, or object for compound)

document.getElementById('answer-date').valueAsDate = new Date();

document.querySelectorAll('.stage-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.stage-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentStage = btn.dataset.stage;
    document.getElementById('stage-explain').textContent = STAGE_EXPLAIN[currentStage];
    renderForm();
  });
});

function visibleItems(){
  if(!currentStage) return [];
  const rule = STAGE_RULES[currentStage];
  return ITEMS.filter(it => rule(it.timing));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderForm(){
  const area = document.getElementById('form-area');
  const items = visibleItems();
  if(items.length === 0){
    area.innerHTML = '<div class="empty-hint">回答タイミングを選択すると質問が表示されます。</div>';
    document.getElementById('footer-bar').classList.add('hidden');
    document.getElementById('progress-bar').classList.add('hidden');
    return;
  }
  document.getElementById('footer-bar').classList.remove('hidden');
  document.getElementById('progress-bar').classList.remove('hidden');

  const cats = [];
  const byCat = {};
  items.forEach(it=>{
    if(!byCat[it.cat]){ byCat[it.cat] = []; cats.push(it.cat); }
    byCat[it.cat].push(it);
  });

  let html = '';
  cats.forEach(cat=>{
    const intro = CATEGORY_INTRO[cat];
    const introHtml = intro ? `<div class="cat-intro">${esc(intro.text)}</div>` : '';
    html += `<section class="category" data-cat="${esc(cat)}">
      <div class="cat-header"><h2>${esc(cat)}</h2><span class="cnt">${byCat[cat].length}項目</span></div>
      ${introHtml}`;
    byCat[cat].forEach(it=>{ html += renderItem(it); });
    html += `</section>`;
  });
  area.innerHTML = html;
  attachHandlers();
  applyConditionals();
  updateProgress();
}

function renderItem(it){
  const inp = it.input;
  const warn = inp.placeholder_scale ? `<span class="warn-flag" title="この項目の選択肢は原版の質問票に明記がなかったため仮の選択肢です。">要確認</span>` : '';
  const chg = '';
  const noteHtml = it.note ? `<div class="item-note">${esc(it.note)}</div>` : '';
  const leadHtml = it.lead ? `<div class="lead-note">${esc(it.lead)}</div>` : '';
  let body = '';

  switch(inp.type){
    case 'radio':
    case 'radio_scale': {
      const cls = inp.type === 'radio_scale' ? 'opt-grid scale-grid' : 'opt-grid';
      body = `<div class="${cls}" data-no="${it.no}" data-kind="choice">`;
      inp.options.forEach(opt=>{
        body += `<button type="button" class="opt-btn" data-val="${esc(opt)}">${esc(opt)}</button>`;
      });
      body += `</div>`;
      if(inp.otherOption){
        body += `<div class="other-text hidden" data-other-for="${it.no}"><input type="text" placeholder="その他の内容を入力"></div>`;
      }
      if(inp.note_field){
        body += `<div class="other-text"><input type="text" data-no="${it.no}-note" placeholder="${esc(inp.note_field)}"></div>`;
      }
      break;
    }
    case 'checkbox_multi': {
      body = `<div class="opt-grid" data-no="${it.no}" data-kind="multi">`;
      inp.options.forEach(opt=>{
        body += `<button type="button" class="opt-btn" data-val="${esc(opt)}">${esc(opt)}</button>`;
      });
      body += `</div>`;
      if(inp.otherOption){
        body += `<div class="other-text hidden" data-other-for="${it.no}"><input type="text" placeholder="その他の内容を入力"></div>`;
      }
      break;
    }
    case 'slider': {
      const mid = Math.round((inp.min+inp.max)/2);
      body = `<div class="slider-wrap" data-no="${it.no}" data-kind="slider">
        <span class="slider-value">${mid}${esc(inp.unit||'')}</span>
        <input type="range" min="${inp.min}" max="${inp.max}" step="${inp.step||1}" value="${mid}">
        <div class="slider-scale-labels"><span>${inp.min}</span><span>${inp.max}${esc(inp.unit||'')}</span></div>
      </div>`;
      break;
    }
    case 'rpe': {
      body = `<div class="slider-wrap" data-no="${it.no}" data-kind="slider">
        <span class="slider-value">13</span>
        <input type="range" min="6" max="20" step="1" value="13">
        <div class="slider-scale-labels"><span>6：非常に楽である</span><span>20：非常にきつい</span></div>
        <div class="rpe-legend">
          <span>7 非常に楽</span><span>9 かなり楽</span><span>11 楽である</span><span>13 ややきつい</span><span>15 きつい</span><span>17 かなりきつい</span><span>19 非常にきつい</span>
        </div>
      </div>`;
      break;
    }
    case 'number':
      body = `<div data-no="${it.no}" data-kind="number">
        <input type="number" inputmode="decimal">
        <span class="unit-suffix">${esc(inp.unit||'')}</span>
      </div>`;
      break;
    case 'date':
      body = `<div data-no="${it.no}" data-kind="date"><input type="date"></div>`;
      break;
    case 'yearmonth':
      body = `<div data-no="${it.no}" data-kind="yearmonth"><input type="month"></div>`;
      break;
    case 'time':
      body = `<div data-no="${it.no}" data-kind="time"><input type="time"></div>`;
      break;
    case 'textarea':
      body = `<div data-no="${it.no}" data-kind="textarea"><textarea placeholder="${esc(inp.placeholder||'')}"></textarea></div>`;
      break;
    case 'week_day':
      body = `<div class="side-by-side" data-no="${it.no}" data-kind="week_day">
        <div class="sub"><div class="lbl">週</div><input type="number" min="0" max="45" data-part="week"></div>
        <div class="sub"><div class="lbl">日</div><input type="number" min="0" max="6" data-part="day"></div>
      </div>`;
      break;
    case 'duration_hm':
      body = `<div class="side-by-side" data-no="${it.no}" data-kind="duration_hm">
        <div class="sub"><div class="lbl">時間</div><input type="number" min="0" max="24" data-part="h"></div>
        <div class="sub"><div class="lbl">分</div><input type="number" min="0" max="59" data-part="m"></div>
      </div>`;
      break;
    case 'children':
      body = renderChildren(it);
      break;
    default:
      body = `<div data-no="${it.no}" data-kind="text"><input type="text" placeholder="${esc(inp.placeholder||'')}"></div>`;
  }

  const labelText = inp.type === 'children' ? 'お子様の人数' : (inp.label || it.text);
  return `${leadHtml}<div class="item" id="item-${it.no}" data-item-no="${it.no}">
    <div class="qtext"><span class="qno">Q${it.no}</span><span>${esc(labelText)}${warn}${chg}</span></div>
    ${noteHtml}
    ${body}
  </div>`;
}

function renderChildren(it){
  return `<div data-no="${it.no}" data-kind="children">
    <div class="opt-grid" data-role="have">
      <button type="button" class="opt-btn" data-val="いない">いない</button>
      <button type="button" class="opt-btn" data-val="いる">いる</button>
    </div>
    <div class="child-block hidden" data-role="block">
      <div class="side-by-side">
        <div class="sub"><div class="lbl">人数</div><input type="number" min="1" max="6" data-role="count" value="1"></div>
      </div>
      <div data-role="ages"></div>
      <div class="child-age">
        <div class="lbl">その他のお子様情報（自由記載）</div>
        <textarea data-role="other"></textarea>
      </div>
    </div>
  </div>`;
}

function attachHandlers(){
  document.querySelectorAll('[data-kind="choice"]').forEach(grp=>{
    const no = grp.dataset.no;
    grp.querySelectorAll('.opt-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        grp.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        answers[no] = b.dataset.val;
        const otherBox = document.querySelector(`[data-other-for="${no}"]`);
        if(otherBox){
          const item = ITEMS.find(i=>String(i.no)===String(no));
          if(item && item.input.otherOption && b.dataset.val === item.input.otherOption){
            otherBox.classList.remove('hidden');
          } else {
            otherBox.classList.add('hidden');
          }
        }
        applyConditionals();
        updateProgress();
      });
    });
  });

  document.querySelectorAll('[data-kind="multi"]').forEach(grp=>{
    const no = grp.dataset.no;
    answers[no] = answers[no] || [];
    grp.querySelectorAll('.opt-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        b.classList.toggle('selected');
        const vals = Array.from(grp.querySelectorAll('.opt-btn.selected')).map(x=>x.dataset.val);
        answers[no] = vals;
        const item = ITEMS.find(i=>String(i.no)===String(no));
        const otherBox = document.querySelector(`[data-other-for="${no}"]`);
        if(otherBox && item && item.input.otherOption){
          if(vals.includes(item.input.otherOption)) otherBox.classList.remove('hidden');
          else otherBox.classList.add('hidden');
        }
        applyConditionals();
        updateProgress();
      });
    });
  });

  document.querySelectorAll('.other-text input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const wrap = inp.closest('.other-text');
      const no = wrap.dataset.otherFor;
      if(no){ answers[no+'_other'] = inp.value; }
    });
  });

  document.querySelectorAll('[data-kind="slider"]').forEach(wrap=>{
    const no = wrap.dataset.no;
    const range = wrap.querySelector('input[type=range]');
    const label = wrap.querySelector('.slider-value');
    range.addEventListener('input', ()=>{
      const item = ITEMS.find(i=>String(i.no)===String(no));
      const unit = (item && item.input.unit) || '';
      label.textContent = range.value + unit;
      answers[no] = range.value;
      updateProgress();
    });
  });

  ['number','date','yearmonth','time','textarea','text'].forEach(kind=>{
    document.querySelectorAll(`[data-kind="${kind}"]`).forEach(wrap=>{
      const no = wrap.dataset.no;
      const field = wrap.querySelector('input,textarea');
      field.addEventListener('input', ()=>{
        answers[no] = field.value;
        updateProgress();
      });
    });
  });

  document.querySelectorAll('[data-kind="week_day"], [data-kind="duration_hm"]').forEach(wrap=>{
    const no = wrap.dataset.no;
    const parts = {};
    wrap.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        wrap.querySelectorAll('input').forEach(i2=>{ parts[i2.dataset.part] = i2.value; });
        answers[no] = {...parts};
        updateProgress();
      });
    });
  });

  document.querySelectorAll('[data-kind="children"]').forEach(wrap=>{
    const no = wrap.dataset.no;
    const haveGrp = wrap.querySelector('[data-role="have"]');
    const block = wrap.querySelector('[data-role="block"]');
    const countInput = wrap.querySelector('[data-role="count"]');
    const agesDiv = wrap.querySelector('[data-role="ages"]');
    const otherArea = wrap.querySelector('[data-role="other"]');

    function renderAges(){
      const n = Math.max(1, Math.min(6, parseInt(countInput.value||'1',10)));
      let html = '';
      for(let i=1;i<=n;i++){
        html += `<div class="child-age"><div class="lbl">第${i}子の年齢（歳）</div><input type="number" min="0" max="20" data-child-age="${i}"></div>`;
      }
      agesDiv.innerHTML = html;
      agesDiv.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', collectChildren);
      });
      collectChildren();
    }
    function collectChildren(){
      const have = haveGrp.querySelector('.opt-btn.selected');
      const haveVal = have ? have.dataset.val : null;
      if(haveVal === 'いない'){
        answers[no] = {have:'いない'};
      } else if(haveVal === 'いる'){
        const ages = Array.from(agesDiv.querySelectorAll('input')).map(i=>i.value);
        answers[no] = {have:'いる', count: countInput.value, ages: ages, other: otherArea.value};
      }
      updateProgress();
    }

    haveGrp.querySelectorAll('.opt-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        haveGrp.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        if(b.dataset.val === 'いる'){
          block.classList.remove('hidden');
          renderAges();
        } else {
          block.classList.add('hidden');
        }
        collectChildren();
      });
    });
    countInput.addEventListener('input', renderAges);
    otherArea.addEventListener('input', collectChildren);
  });
}

function applyConditionals(){
  ITEMS.forEach(it=>{
    if(!it.show_if) return;
    const el = document.getElementById('item-'+it.no);
    if(!el) return;
    const dep = answers[it.show_if.no];
    let ok;
    if(Array.isArray(dep)){
      ok = dep.some(d=>it.show_if.in.includes(d));
    } else {
      ok = dep !== undefined && it.show_if.in.includes(dep);
    }
    el.classList.toggle('hidden-cond', !ok);
  });
}

function isItemCurrentlyVisible(it){
  const el = document.getElementById('item-'+it.no);
  if(!el) return false;
  return !el.classList.contains('hidden-cond');
}

function isAnswered(it){
  const v = answers[it.no];
  if(it.input.type === 'children'){
    if(!v) return false;
    if(v.have === 'いない') return true;
    if(v.have === 'いる') return v.count && v.ages && v.ages.every(a=>a!=='');
    return false;
  }
  if(it.input.type === 'week_day' || it.input.type === 'duration_hm'){
    return v && Object.values(v).some(x=>x!=='' && x!=null);
  }
  if(Array.isArray(v)) return v.length>0;
  return v !== undefined && v !== '';
}

function updateProgress(){
  const items = visibleItems().filter(isItemCurrentlyVisible);
  const total = items.length;
  const answered = items.filter(isAnswered).length;
  const pct = total ? Math.round(answered/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answered} / ${total} 項目`;
  document.getElementById('progress-pct').textContent = pct + '%';
}

function formatAnswer(it){
  const v = answers[it.no];
  if(v === undefined) return '';
  if(it.input.type === 'children'){
    if(!v || v.have === 'いない') return 'いない';
    if(v.have === 'いる'){
      let s = `いる（${v.count}人）`;
      (v.ages||[]).forEach((a,i)=>{ s += ` 第${i+1}子:${a}歳`; });
      if(v.other) s += ` /その他:${v.other}`;
      return s;
    }
    return '';
  }
  if(it.input.type === 'week_day') return `${v.week||''}週${v.day||''}日`;
  if(it.input.type === 'duration_hm') return `${v.h||''}時間${v.m||''}分`;
  if(Array.isArray(v)){
    let s = v.join('、');
    if(answers[it.no+'_other']) s += `（その他：${answers[it.no+'_other']}）`;
    return s;
  }
  let s = String(v);
  if(answers[it.no+'_other']) s += `（その他：${answers[it.no+'_other']}）`;
  return s;
}

function buildSubmission(){
  const items = visibleItems().filter(isItemCurrentlyVisible);
  const answersFlat = {};
  items.forEach(it=>{
    answersFlat[it.no] = { question: it.input.label || it.text || '', value: formatAnswer(it) };
  });
  return {
    stage: currentStage,
    answer_date: document.getElementById('answer-date').value,
    generated_at: new Date().toISOString(),
    answers: answersFlat
  };
}

async function submitToSheet(){
  const statusEl = document.getElementById('submit-status');
  if(!SUBMIT_URL || SUBMIT_URL.indexOf('PASTE_YOUR_WEB_APP_URL_HERE') !== -1){
    statusEl.textContent = '送信先が未設定のため、自動送信はスキップしました。下のボタンでファイルを保存してください。';
    return;
  }
  try{
    const resp = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(buildSubmission())
    });
    const json = await resp.json();
    if(json && json.ok){
      statusEl.textContent = '回答を送信しました。ご協力ありがとうございました。';
    } else {
      statusEl.textContent = '送信に失敗しました。念のため下のボタンでファイルを保存し、担当者にお送りください。';
    }
  } catch(err){
    statusEl.textContent = '送信できませんでした（通信環境をご確認ください）。念のため下のボタンでファイルを保存し、担当者にお送りください。';
  }
}

function buildRecord(){
  const items = visibleItems().filter(isItemCurrentlyVisible);
  const record = {
    stage: currentStage,
    answer_date: document.getElementById('answer-date').value,
    generated_at: new Date().toISOString(),
    answers: {}
  };
  items.forEach(it=>{
    record.answers[`Q${it.no}_${it.cat}`] = {
      question: it.input.label || it.text || '',
      value: formatAnswer(it)
    };
  });
  return record;
}

function download(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportJSON(){
  const rec = buildRecord();
  download(`survey_${rec.stage}_${rec.answer_date||'nodate'}.json`, JSON.stringify(rec, null, 2), 'application/json');
}
function exportCSV(){
  const rec = buildRecord();
  let rows = [['項目ID','質問','回答']];
  Object.entries(rec.answers).forEach(([k,v])=>{ rows.push([k, v.question, v.value]); });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download(`survey_${rec.stage}_${rec.answer_date||'nodate'}.csv`, '\uFEFF'+csv, 'text/csv');
}

document.getElementById('btn-json').addEventListener('click', exportJSON);
document.getElementById('btn-csv').addEventListener('click', exportCSV);
document.getElementById('btn-json-2').addEventListener('click', exportJSON);
document.getElementById('btn-csv-2').addEventListener('click', exportCSV);
document.getElementById('btn-finish').addEventListener('click', ()=>{
  document.querySelector('.wrap').classList.add('hidden');
  document.getElementById('footer-bar').classList.add('hidden');
  document.getElementById('progress-bar').classList.add('hidden');
  document.getElementById('done-screen').classList.remove('hidden');
  document.getElementById('submit-status').textContent = '送信しています…';
  submitToSheet();
});
document.getElementById('btn-back').addEventListener('click', ()=>{
  document.getElementById('done-screen').classList.add('hidden');
  document.querySelector('.wrap').classList.remove('hidden');
  document.getElementById('footer-bar').classList.remove('hidden');
  document.getElementById('progress-bar').classList.remove('hidden');
});
</script>
</body>
