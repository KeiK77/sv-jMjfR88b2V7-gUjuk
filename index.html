<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妊娠期・産後 健康調査アンケート</title>
<style>
  :root{
    --ink:#1f2a2e;
    --sub:#5b6b6f;
    --paper:#f6f5f1;
    --card:#ffffff;
    --line:#dfe3e0;
    --teal:#2f6f68;
    --teal-dark:#1f4f4a;
    --teal-tint:#e7f0ee;
    --amber:#c98a3a;
    --amber-tint:#fbf1e2;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:120px;
  }
  header.top{ background:var(--teal-dark); color:#fff; padding:28px 20px 22px; }
  header.top h1{ margin:0 0 6px; font-size:1.35rem; font-weight:700; letter-spacing:.02em; }
  header.top p{ margin:0; color:#cfe4e0; font-size:.88rem; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:18px; }
  .panel h2{ font-size:1.02rem; margin:0 0 4px; color:var(--teal-dark); }
  .panel .cat-count{ font-size:.78rem; color:var(--sub); margin-bottom:14px; }
  .stage-select{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px; }
  .stage-btn{ border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:14px 8px; font-size:.86rem; font-weight:600; color:var(--ink); cursor:pointer; text-align:center; line-height:1.4; transition:all .15s ease; }
  .stage-btn small{ display:block; font-weight:400; color:var(--sub); font-size:.72rem; margin-top:3px; }
  .stage-btn.active{ border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark); }
  .meta-row{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .meta-field{flex:1; min-width:140px;}
  label.field-label{ display:block; font-size:.8rem; color:var(--sub); margin-bottom:5px; }
  input[type=text], input[type=number], input[type=date], input[type=time], textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 11px; font-size:.95rem;
    font-family:inherit; background:#fdfdfc; color:var(--ink);
  }
  textarea{min-height:64px; resize:vertical;}
  input:focus, textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  #progress-bar{ position:sticky; top:0; z-index:20; background:var(--paper); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
  .progress-track{ height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); width:0%; transition:width .2s ease; }
  .progress-label{ font-size:.72rem; color:var(--sub); margin-top:4px; display:flex; justify-content:space-between; }
  section.category{ margin-top:22px; }
  section.category .cat-header{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--teal); padding-bottom:8px; margin-bottom:4px; }
  section.category .cat-header h2{ font-size:1.05rem; color:var(--teal-dark); margin:0; }
  section.category .cat-header .cnt{ font-size:.75rem; color:var(--sub); }
  .item{ padding:16px 4px; border-bottom:1px solid var(--line); }
  .item:last-child{border-bottom:none;}
  .item.hidden-cond{ display:none !important; }
  .item .qtext{ font-size:.95rem; font-weight:600; margin-bottom:8px; display:flex; gap:6px; align-items:flex-start; }
  .item .qno{ color:var(--teal); font-weight:700; font-size:.82rem; flex-shrink:0; min-width:34px; }
  .item-note{ font-size:.76rem; color:var(--sub); margin:-4px 0 10px 40px; }
  .opt-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt-btn{ border:1.4px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-size:.85rem; cursor:pointer; color:var(--ink); }
  .opt-btn.selected{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .slider-wrap{padding:6px 4px 0;}
  .slider-value{ font-weight:700; color:var(--teal-dark); font-size:.95rem; margin-bottom:6px; display:inline-block; background:var(--teal-tint); padding:2px 10px; border-radius:6px; }
  input[type=range]{ width:100%; accent-color:var(--teal); }
  .slider-scale-labels{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--sub); margin-top:2px; }
  .unit-suffix{ font-size:.8rem; color:var(--sub); margin-left:6px; }
  .side-by-side{ display:flex; gap:10px; align-items:center; }
  .side-by-side .sub{ flex:1; }
  .side-by-side .sub .lbl{ font-size:.72rem; color:var(--sub); margin-bottom:3px; }
  .child-block{ border:1px dashed var(--line); border-radius:10px; padding:12px; margin-top:10px; background:#fafaf8; }
  .child-age{ margin-top:8px; }
  .child-age .lbl{ font-size:.8rem; color:var(--sub); margin-bottom:4px; }
  #footer-bar{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; justify-content:center; z-index:30; box-shadow:0 -4px 14px rgba(0,0,0,.05); }
  .btn{ border:none; border-radius:9px; padding:13px 18px; font-size:.9rem; font-weight:700; cursor:pointer; }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-secondary{background:var(--teal-tint); color:var(--teal-dark);}
  .top-note{ font-size:.78rem; color:var(--sub); background:var(--teal-tint); border-radius:8px; padding:10px 12px; margin-top:14px; }
  #done-screen{ text-align:center; padding:60px 20px; }
  #done-screen h2{color:var(--teal-dark);}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="gate-screen" style="max-width:400px;margin:80px auto;padding:0 20px;text-align:center;">
  <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 24px;">
    <h1 style="font-size:1.1rem;color:var(--teal-dark);margin:0 0 6px;">妊娠期・産後 健康調査アンケート</h1>
    <p style="font-size:.82rem;color:var(--sub);margin:0 0 20px;">担当者から伝えられた合言葉を入力してください</p>
    <input type="text" id="gate-input" placeholder="合言葉" autocomplete="off" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:1rem;text-align:center;">
    <div id="gate-error" style="color:#b3452f;font-size:.78rem;margin-top:8px;min-height:1.2em;"></div>
    <button id="gate-submit" class="btn btn-primary" style="width:100%;margin-top:14px;">進む</button>
  </div>
</div>

<div id="app-content" class="hidden">
<header class="top">
  <div class="wrap">
    <h1>妊娠期・産後 健康調査アンケート</h1>
    <p>身体活動・腰痛・骨盤帯痛・睡眠・気分に関する調査です。回答時期を選ぶと、その時期に必要な質問だけが表示されます。</p>
  </div>
</header>

<div id="progress-bar" class="hidden">
  <div class="wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">0 / 0 項目</span><span id="progress-pct">0%</span></div>
  </div>
</div>

<div class="wrap">
  <div class="panel hidden" id="resume-banner">
    <h2>前回の続きがあります</h2>
    <p class="cat-count" id="resume-info">保存されている回答があります。続きから再開しますか？</p>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="resume-continue">続きから再開する</button>
      <button class="btn btn-secondary" id="resume-restart">最初からやり直す</button>
    </div>
  </div>

  <div class="panel" id="stage-panel">
    <h2>1. 回答のタイミングを選択してください</h2>
    <div class="cat-count">選択した時期に応じて、以下の質問が自動で表示されます。</div>
    <div class="stage-select">
      <button class="stage-btn" data-stage="初回">初回<small>妊娠期・最初の回答</small></button>
      <button class="stage-btn" data-stage="2回目以降">2回目以降<small>妊娠期・毎回</small></button>
      <button class="stage-btn" data-stage="産後">産後<small>産後1か月など</small></button>
    </div>
    <div class="meta-row">
      <div class="meta-field">
        <label class="field-label">回答日</label>
        <input type="date" id="answer-date">
      </div>
    </div>
    <div class="top-note" id="stage-explain"></div>
  </div>

  <div id="form-area"></div>
</div>

<div id="footer-bar" class="hidden">
  <button class="btn btn-secondary" id="btn-json">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv">CSVで保存</button>
  <button class="btn btn-primary" id="btn-finish">回答を確認して完了</button>
</div>

<div id="done-screen" class="hidden">
  <h2>ご回答ありがとうございました</h2>
  <p id="submit-status">送信しています…</p>
  <p style="font-size:.8rem;color:var(--sub);">念のため、下のボタンからも回答データを保存できます。</p>
  <button class="btn btn-primary" id="btn-json-2">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv-2">CSVで保存</button>
  <div style="margin-top:14px;"><button class="btn btn-secondary" id="btn-back">回答画面に戻る</button></div>
</div>
</div>

  const SECRET_PASS = "1234"; // 合言葉の設定

  const gateScreen = document.getElementById("gate-screen");
  const appContent = document.getElementById("app-content");
  const gateInput = document.getElementById("gate-input");
  const gateSubmit = document.getElementById("gate-submit");
  const gateError = document.getElementById("gate-error");

  const rawData = JSON.parse(document.getElementById("items-data").textContent);
  let currentStage = null;
  let answers = {};

  // 合言葉認証
  gateSubmit.addEventListener("click", () => {
    if(gateInput.value.trim() === SECRET_PASS || SECRET_PASS === "") {
      gateScreen.classList.add("hidden");
      appContent.classList.remove("hidden");
    } else {
      gateError.textContent = "合言葉が違います";
    }
  });

  const today = new Date().toISOString().split("T")[0];
  document.getElementById("answer-date").value = today;

  const stageBtns = document.querySelectorAll(".stage-btn");
  stageBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      stageBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStage = btn.dataset.stage;
      renderForm();
    });
  });

  function renderForm() {
    const formArea = document.getElementById("form-area");
    formArea.innerHTML = "";

    else explain.textContent = "【産後】産後用の設問が表示されます。";

    document.getElementById("progress-bar").classList.remove("hidden");
    document.getElementById("footer-bar").classList.remove("hidden");

    const filtered = rawData.filter(item => {
      if(item.timing === "毎回") return true;
      if(currentStage === "初回" && item.timing === "初回") return true;
      if(currentStage === "産後" && item.timing === "産後のみ") return true;
      if((currentStage === "初回" || currentStage === "2回目以降") && item.timing === "産前のみ") return true;
      return false;
    });

    const groups = {};
    filtered.forEach(item => {
      if(!groups[item.cat]) groups[item.cat] = [];
      groups[item.cat].push(item);
    });

    for(let cat in groups) {
      const sec = document.createElement("section");
      sec.className = "category panel";
      sec.innerHTML = `<div class="cat-header"><h2>${cat}</h2></div>`;

      groups[cat].forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = "item";
        itemEl.id = `item-${item.no}`;
        
        let html = `<div class="qtext"><span class="qno">Q${item.no}</span><span>${item.input.label}</span></div>`;

        if(item.input.type === "text" || item.input.type === "number" || item.input.type === "date" || item.input.type === "time") {
          const unitHtml = item.input.unit ? `<span class="unit-suffix">${item.input.unit}</span>` : "";
          html += `<div style="display:flex;align-items:center;"><input type="${item.input.type}" data-no="${item.no}" class="inp-field" placeholder="${item.input.placeholder || ''}">${unitHtml}</div>`;
        } else if(item.input.type === "textarea") {
          html += `<textarea data-no="${item.no}" class="inp-field"></textarea>`;
        } else if(item.input.type === "week_day") {
          html += `<div class="side-by-side">
            <div class="sub"><div class="lbl">週</div><input type="number" data-no="${item.no}" data-part="w" class="inp-field"></div>
            <div class="sub"><div class="lbl">日</div><input type="number" data-no="${item.no}" data-part="d" class="inp-field"></div>
          </div>`;
        } else if(item.input.type === "yearmonth") {
          html += `<div class="side-by-side">
            <div class="sub"><div class="lbl">年</div><input type="number" data-no="${item.no}" data-part="y" class="inp-field" placeholder="1990"></div>
            <div class="sub"><div class="lbl">月</div><input type="number" data-no="${item.no}" data-part="m" class="inp-field" placeholder="1"></div>
          </div>`;
        } else if(item.input.type === "radio" || item.input.type === "radio_scale") {
          html += `<div class="opt-grid">`;
          item.input.options.forEach(opt => {
            html += `<button type="button" class="opt-btn" data-no="${item.no}" data-val="${opt}">${opt}</button>`;
          });
          html += `</div>`;
        } else if(item.input.type === "checkbox_multi") {
          html += `<div class="opt-grid">`;
          item.input.options.forEach(opt => {
            html += `<button type="button" class="opt-btn multi-btn" data-no="${item.no}" data-val="${opt}">${opt}</button>`;
          });
          html += `</div>`;
        } else if(item.input.type === "slider") {
          html += `<div class="slider-wrap">
            <span class="slider-value" id="val-${item.no}">${item.input.min}${item.input.unit || ""}</span>
            <input type="range" min="${item.input.min}" max="${item.input.max}" step="${item.input.step}" value="${item.input.min}" data-no="${item.no}" class="slider-field">
            <div class="slider-scale-labels"><span>${item.input.min}</span><span>${item.input.max}</span></div>
          </div>`;
        } else if(item.input.type === "rpe") {
          html += `<div class="slider-wrap">
            <span class="slider-value" id="val-${item.no}">6 (非常に楽)</span>
            <input type="range" min="6" max="20" step="1" value="6" data-no="${item.no}" class="slider-field">
            <div class="slider-scale-labels"><span>6 (非常に楽)</span><span>20 (限界)</span></div>
          </div>`;
        } else if(item.input.type === "children") {
          html += `<div class="child-block"><p style="margin:0 0 8px;font-size:.85rem;">お子様の人数や年齢に関する設問（必要に応じて入力）</p><input type="text" data-no="${item.no}" class="inp-field" placeholder="例：長男（3歳）、長女（1歳）"></div>`;
        }

        itemEl.innerHTML += html;
        sec.appendChild(itemEl);
      });

      formArea.appendChild(sec);
    }

    attachEvents();
    checkConditions();
    calcProgress();
  }

  function attachEvents() {
    document.querySelectorAll(".opt-btn:not(.multi-btn)").forEach(btn => {
      btn.addEventListener("click", () => {
        const no = btn.dataset.no;
        const parent = btn.parentElement;
        parent.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        answers[no] = btn.dataset.val;
        checkConditions();
        calcProgress();
      });
    });

    document.querySelectorAll(".multi-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const no = btn.dataset.no;
        btn.classList.toggle("selected");
        const parent = btn.parentElement;
        const selected = Array.from(parent.querySelectorAll(".multi-btn.selected")).map(b => b.dataset.val);
        answers[no] = selected.join(", ");
        checkConditions();
        calcProgress();
      });
    });

    document.querySelectorAll(".slider-field").forEach(s => {
      s.addEventListener("input", () => {
        const no = s.dataset.no;
        const item = rawData.find(i => i.no == no);
        const valDisp = document.getElementById(`val-${no}`);
        if(valDisp) {
          valDisp.textContent = s.value + (item.input.unit || "");
        }
        answers[no] = s.value;
        calcProgress();
      });
    });

    document.querySelectorAll(".inp-field").forEach(inp => {
      inp.addEventListener("input", () => {
        const no = inp.dataset.no;
        answers[no] = inp.value;
        calcProgress();
      });
    });
  }

  function checkConditions() {
    rawData.forEach(item => {
      if(item.show_if) {
        const targetVal = answers[item.show_if.no] || "";
        const targetEl = document.getElementById(`item-${item.no}`);
        if(targetEl) {
          const match = item.show_if.in.some(v => targetVal.includes(v));
          if(match) {
            targetEl.classList.remove("hidden-cond");
          } else {
            targetEl.classList.add("hidden-cond");
          }
        }
      }
    });
  }

  function calcProgress() {
    const visibleItems = document.querySelectorAll(".item:not(.hidden-cond)");
    let answeredCount = 0;
    visibleItems.forEach(item => {
      const no = item.id.replace("item-", "");
      if(answers[no] !== undefined && answers[no] !== "") {
        answeredCount++;
      }
    });
    const total = visibleItems.length;
    const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("progress-text").textContent = `${answeredCount} / ${total} 項目回答`;
    document.getElementById("progress-pct").textContent = pct + "%";
  }

  function downloadFile(content, fileName, contentType) {
    const a = document.createElement("a");
    const file = new Blob([content], { type: contentType });
    a.href = URL.createObjectURL(file);
    a.download = fileName;
    a.click();
  }

  document.getElementById("btn-json").addEventListener("click", () => {
    downloadFile(JSON.stringify(answers, null, 2), "survey_result.json", "application/json");
  });

  document.getElementById("btn-csv").addEventListener("click", () => {
    let csv = "Item_No,Answer\n";
    for(let k in answers) {
      csv += `Q${k},"${answers[k]}"\n`;
    }
    downloadFile(csv, "survey_result.csv", "text/csv;charset=utf-8;");
  });

  document.getElementById("btn-finish").addEventListener("click", () => {
    document.getElementById("stage-panel").classList.add("hidden");
    document.getElementById("form-area").classList.add("hidden");
    document.getElementById("footer-bar").classList.add("hidden");
    document.getElementById("progress-bar").classList.add("hidden");
    document.getElementById("done-screen").classList.remove("hidden");
    document.getElementById("submit-status").textContent = "回答データが正常に記録されました。";
  });
});
</script>

</body>
</html>
