<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妊娠期・産後 健康調査アンケート</title>
<style>
  :root{
    --ink:#1f2a2e;
    --sub:#5b6b6f;
    --paper:#f6f5f1;
    --card:#ffffff;
    --line:#dfe3e0;
    --teal:#2f6f68;
    --teal-dark:#1f4f4a;
    --teal-tint:#e7f0ee;
    --amber:#c98a3a;
    --amber-tint:#fbf1e2;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:140px;
  }
  header.top{ background:var(--teal-dark); color:#fff; padding:28px 20px 22px; }
  header.top h1{ margin:0 0 6px; font-size:1.35rem; font-weight:700; letter-spacing:.02em; }
  header.top p{ margin:0; color:#cfe4e0; font-size:.88rem; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px; }
  
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:18px; }
  .panel h2{ font-size:1.05rem; margin:0 0 4px; color:var(--teal-dark); }
  .panel .cat-count{ font-size:.82rem; color:var(--sub); margin-bottom:14px; }
  
  .stage-select{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:10px; }
  .stage-btn{ 
    border:1.5px solid var(--line); 
    background:#fff; 
    border-radius:12px; 
    padding:16px 10px; 
    font-size:.92rem; 
    font-weight:600; 
    color:var(--ink); 
    cursor:pointer; 
    text-align:center; 
    line-height:1.4; 
    transition:all .15s ease; 
    min-height:70px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }
  .stage-btn small{ display:block; font-weight:400; color:var(--sub); font-size:.75rem; margin-top:4px; }
  .stage-btn.active{ border-color:var(--teal); background:var(--teal-tint); color:var(--teal-dark); border-width:2px; }
  
  .meta-row{ display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
  .meta-field{ flex:1; min-width:100%; }
  label.field-label{ display:block; font-size:.85rem; color:var(--sub); margin-bottom:6px; font-weight:600; }
  input[type=text], input[type=number], input[type=date], input[type=time], textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:1rem;
    font-family:inherit; background:#fdfdfc; color:var(--ink);
  }
  textarea{ min-height:80px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--teal); outline-offset:1px; }

  #progress-bar{ position:sticky; top:0; z-index:20; background:var(--paper); padding:10px 16px 8px; border-bottom:1px solid var(--line); }
  .progress-track{ height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); width:0%; transition:width .2s ease; }
  .progress-label{ font-size:.78rem; color:var(--sub); margin-top:4px; display:flex; justify-content:space-between; }

  section.category{ margin-top:24px; }
  section.category .cat-header{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:2px solid var(--teal); padding-bottom:8px; margin-bottom:12px; }
  section.category .cat-header h2{ font-size:1.1rem; color:var(--teal-dark); margin:0; }
  section.category .cat-header .cnt{ font-size:.78rem; color:var(--sub); }
  
  .item{ padding:18px 0; border-bottom:1px solid var(--line); }
  .item:last-child{ border-bottom:none; }
  .item.hidden-cond{ display:none !important; }
  .item .qtext{ font-size:1rem; font-weight:600; margin-bottom:10px; display:flex; gap:6px; align-items:flex-start; line-height:1.5; }
  .item .qno{ color:var(--teal); font-weight:700; font-size:.9rem; flex-shrink:0; min-width:32px; }
  
  .opt-grid{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{ 
    border:1.5px solid var(--line); 
    background:#fff; 
    border-radius:12px; 
    padding:14px 16px; 
    font-size:.95rem; 
    cursor:pointer; 
    color:var(--ink); 
    text-align:left; 
    width:100%; 
    transition:background-color .15s ease, border-color .15s ease;
  }
  .opt-btn.selected{ background:var(--teal); border-color:var(--teal); color:#fff; font-weight:700; }

  .slider-wrap{ padding:10px 4px 4px; }
  .slider-value{ font-weight:700; color:var(--teal-dark); font-size:1.05rem; margin-bottom:8px; display:inline-block; background:var(--teal-tint); padding:4px 12px; border-radius:6px; }
  input[type=range]{ width:100%; height:28px; accent-color:var(--teal); cursor:pointer; }
  
  .slider-scale-labels{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--sub); margin-top:6px; }
  .rpe-legend{ font-size:.75rem; color:var(--sub); margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 12px; }
  .unit-suffix{ font-size:.85rem; color:var(--sub); margin-left:6px; }
  .side-by-side{ display:flex; gap:10px; align-items:center; }
  .side-by-side .sub{ flex:1; }
  .side-by-side .sub .lbl{ font-size:.78rem; color:var(--sub); margin-bottom:4px; }
  .other-text{ margin-top:10px; }

  #footer-bar{ 
    position:fixed; 
    bottom:0; 
    left:0; 
    right:0; 
    background:#fff; 
    border-top:1px solid var(--line); 
    padding:12px 16px; 
    display:flex; 
    gap:8px; 
    justify-content:space-between; 
    z-index:30; 
    box-shadow:0 -4px 14px rgba(0,0,0,.08); 
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  .btn{ 
    border:none; 
    border-radius:10px; 
    padding:14px 16px; 
    font-size:.92rem; 
    font-weight:700; 
    cursor:pointer; 
    flex:1; 
    text-align:center;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-secondary{ background:var(--teal-tint); color:var(--teal-dark); }
  
  .top-note{ font-size:.82rem; color:var(--sub); background:var(--teal-tint); border-radius:8px; padding:12px; margin-top:14px; }
  #done-screen{ text-align:center; padding:60px 20px; }
  #done-screen h2{ color:var(--teal-dark); }
  .hidden{ display:none !important; }

  @media (max-width: 500px) {
    .stage-select { grid-template-columns: 1fr; gap: 8px; }
    .stage-btn { min-height: auto; padding: 14px; text-align: left; align-items: flex-start; }
    .stage-btn small { display: inline-block; margin-top: 2px; margin-left: 6px; }
    #footer-bar { flex-direction: column; }
  }
</style>
</head>
<body>

<div id="app-content">

<header class="top">
  <div class="wrap">
    <h1>妊娠期・産後 健康調査アンケート</h1>
    <p>身体活動・腰痛・骨盤帯痛・睡眠・気分に関する調査です。回答時期を選ぶと、その時期に必要な質問だけが表示されます。</p>
  </div>
</header>

<div id="progress-bar" class="hidden">
  <div class="wrap">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">0 / 0 項目</span><span id="progress-pct">0%</span></div>
  </div>
</div>

<div class="wrap">

  <div class="panel" id="stage-panel">
    <h2>1. 回答のタイミングを選択してください</h2>
    <div class="cat-count">選択した時期に応じて、以下の質問が自動で表示されます。</div>
    <div class="stage-select">
      <button class="stage-btn" data-stage="初回">初回 <small>妊娠期・最初の回答</small></button>
      <button class="stage-btn" data-stage="2回目以降">2回目以降 <small>妊娠期・毎回</small></button>
      <button class="stage-btn" data-stage="産後">産後 <small>産後1か月など</small></button>
    </div>

    <div class="meta-row">
      <div class="meta-field">
        <label class="field-label">回答日</label>
        <input type="date" id="answer-date">
      </div>
    </div>
    <div class="top-note hidden" id="stage-explain"></div>
  </div>

  <div id="form-area"></div>

</div>

<div id="footer-bar" class="hidden">
  <button class="btn btn-secondary" id="btn-json">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv">CSVで保存</button>
  <button class="btn btn-primary" id="btn-finish">回答を確認して完了</button>
</div>

<div id="done-screen" class="hidden">
  <h2>ご回答ありがとうございました</h2>
  <p id="submit-status">送信完了しました。</p>
  <button class="btn btn-primary" id="btn-json-2">JSONで保存</button>
  <button class="btn btn-secondary" id="btn-csv-2">CSVで保存</button>
</div>

</div>

<script id="items-data" type="application/json">
[{"no": 1, "cat": "基本情報", "timing": "毎回", "input": {"type": "text", "label": "ID（診察券番号）"}}, {"no": 3, "cat": "基本情報", "timing": "産前のみ", "input": {"type": "week_day", "label": "妊娠週数・日数"}}, {"no": 4, "cat": "基本情報", "timing": "初回", "input": {"type": "date", "label": "出産予定日"}}, {"no": 5, "cat": "基本情報", "timing": "産後のみ", "input": {"type": "date", "label": "出産日"}}, {"no": 6, "cat": "基本情報", "timing": "産後のみ", "input": {"type": "number", "label": "産後日数", "unit": "日目"}}, {"no": 7, "cat": "基本情報", "timing": "初回", "input": {"type": "number", "label": "身長", "unit": "cm"}}, {"no": 8, "cat": "基本情報", "timing": "毎回", "input": {"type": "number", "label": "本日の体重", "unit": "kg"}}, {"no": 9, "cat": "基本情報", "timing": "初回", "input": {"type": "yearmonth", "label": "生年月"}}, {"no": 10, "cat": "基本情報", "timing": "毎回", "input": {"type": "number", "label": "現在の年齢", "unit": "歳"}}, {"no": 11, "cat": "基本情報", "timing": "初回", "input": {"type": "radio", "label": "婚姻に関して", "options": ["未婚", "結婚", "その他"]}}, {"no": 15, "cat": "基本情報", "timing": "毎回", "input": {"type": "radio", "label": "定期的に運動（健康のために行っている運動）をしていますか", "options": ["いいえ", "はい"]}}, {"no": 16, "cat": "基本情報", "timing": "毎回", "input": {"type": "textarea", "label": "運動していない理由"}, "show_if": {"no": 15, "in": ["いいえ"]}}, {"no": 17, "cat": "基本情報", "timing": "毎回", "input": {"type": "text", "label": "運動の種類"}, "show_if": {"no": 15, "in": ["はい"]}}, {"no": 82, "cat": "バランスに対する自信度", "timing": "毎回", "input": {"type": "slider", "label": "家の中を歩くとき、バランスを崩したりふらついたりしないという自信", "min": 0, "max": 100, "step": 10, "unit": "%"}}, {"no": 98, "cat": "痛みの評価", "timing": "毎回", "input": {"type": "slider", "label": "腰部の痛みの程度", "min": 0, "max": 10, "step": 1, "unit": ""}}]
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const rawData = JSON.parse(document.getElementById("items-data").textContent);
  let currentStage = null;
  let answers = {};

  const today = new Date().toISOString().split("T")[0];
  document.getElementById("answer-date").value = today;

  const stageBtns = document.querySelectorAll(".stage-btn");
  stageBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      stageBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStage = btn.dataset.stage;
      renderForm();
    });
  });

  function renderForm() {
    const formArea = document.getElementById("form-area");
    formArea.innerHTML = "";

    const explain = document.getElementById("stage-explain");
    explain.classList.remove("hidden");
    if(currentStage === "初回") explain.textContent = "妊娠期の初回回答フォームを表示しています。";
    else if(currentStage === "2回目以降") explain.textContent = "妊娠期の継続回答フォームを表示しています。";
    else explain.textContent = "産後の調査フォームを表示しています。";

    document.getElementById("progress-bar").classList.remove("hidden");
    document.getElementById("footer-bar").classList.remove("hidden");

    const filtered = rawData.filter(item => {
      if(item.timing === "毎回") return true;
      if(currentStage === "初回" && item.timing === "初回") return true;
      if(currentStage === "産後" && item.timing === "産後のみ") return true;
      if((currentStage === "初回" || currentStage === "2回目以降") && item.timing === "産前のみ") return true;
      return false;
    });

    const groups = {};
    filtered.forEach(item => {
      if(!groups[item.cat]) groups[item.cat] = [];
      groups[item.cat].push(item);
    });

    for(let cat in groups) {
      const sec = document.createElement("section");
      sec.className = "category panel";
      sec.innerHTML = `<div class="cat-header"><h2>${cat}</h2></div>`;

      groups[cat].forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = "item";
        itemEl.id = `item-${item.no}`;
        
        let html = `<div class="qtext"><span class="qno">Q${item.no}</span><span>${item.input.label}</span></div>`;

        if(item.input.type === "text" || item.input.type === "number" || item.input.type === "date") {
          html += `<input type="${item.input.type}" data-no="${item.no}" class="inp-field">`;
        } else if(item.input.type === "textarea") {
          html += `<textarea data-no="${item.no}" class="inp-field"></textarea>`;
        } else if(item.input.type === "week_day") {
          html += `<div class="side-by-side">
            <div class="sub"><div class="lbl">週</div><input type="number" data-no="${item.no}" data-part="w" class="inp-field"></div>
            <div class="sub"><div class="lbl">日</div><input type="number" data-no="${item.no}" data-part="d" class="inp-field"></div>
          </div>`;
        } else if(item.input.type === "yearmonth") {
          html += `<div class="side-by-side">
            <div class="sub"><div class="lbl">年</div><input type="number" data-no="${item.no}" data-part="y" class="inp-field" placeholder="YYYY"></div>
            <div class="sub"><div class="lbl">月</div><input type="number" data-no="${item.no}" data-part="m" class="inp-field" placeholder="MM"></div>
          </div>`;
        } else if(item.input.type === "radio") {
          html += `<div class="opt-grid">`;
          item.input.options.forEach(opt => {
            html += `<button type="button" class="opt-btn" data-no="${item.no}" data-val="${opt}">${opt}</button>`;
          });
          html += `</div>`;
        } else if(item.input.type === "slider") {
          html += `<div class="slider-wrap">
            <span class="slider-value" id="val-${item.no}">0${item.input.unit}</span>
            <input type="range" min="${item.input.min}" max="${item.input.max}" step="${item.input.step}" value="0" data-no="${item.no}" class="slider-field">
            <div class="slider-scale-labels"><span>0</span><span>${item.input.max}</span></div>
          </div>`;
        }

        itemEl.innerHTML += html;
        sec.appendChild(itemEl);
      });

      formArea.appendChild(sec);
    }

    attachEvents();
    checkConditions();
  }

  function attachEvents() {
    document.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const no = btn.dataset.no;
        const parent = btn.parentElement;
        parent.querySelectorAll(".opt-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        answers[no] = btn.dataset.val;
        checkConditions();
      });
    });

    document.querySelectorAll(".slider-field").forEach(s => {
      s.addEventListener("input", (e) => {
        const no = s.dataset.no;
        const item = rawData.find(i => i.no == no);
        document.getElementById(`val-${no}`).textContent = s.value + (item.input.unit || "");
        answers[no] = s.value;
      });
    });

    document.querySelectorAll(".inp-field").forEach(inp => {
      inp.addEventListener("change", () => {
        const no = inp.dataset.no;
        answers[no] = inp.value;
      });
    });
  }

  function checkConditions() {
    rawData.forEach(item => {
      if(item.show_if) {
        const targetVal = answers[item.show_if.no];
        const targetEl = document.getElementById(`item-${item.no}`);
        if(targetEl) {
          if(targetVal && item.show_if.in.includes(targetVal)) {
            targetEl.classList.remove("hidden-cond");
          } else {
            targetEl.classList.add("hidden-cond");
          }
        }
      }
    });
  }

  document.getElementById("btn-finish").addEventListener("click", () => {
    document.getElementById("stage-panel").classList.add("hidden");
    document.getElementById("form-area").classList.add("hidden");
    document.getElementById("footer-bar").classList.add("hidden");
    document.getElementById("progress-bar").classList.add("hidden");
    document.getElementById("done-screen").classList.remove("hidden");
  });
});
</script>

</body>
</html>
